worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # The TLS terminator must overwrite X-Forwarded-For. Trust its exact CIDR only.
  set_real_ip_from ${TRUSTED_EDGE_CIDR};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=forms:10m rate=6r/m;
  limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
  # Only a local TLS terminator can reach the loopback-bound published port.
  # It must overwrite X-Forwarded-Proto. Never expose this listener directly.
  map $http_x_forwarded_proto $rgi_proto { default http; https https; }
  log_format minimal '$remote_addr $request_method $uri $status';
  access_log /var/log/nginx/access.log minimal;
  server {
    listen 8080;
    client_max_body_size 12m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /media/ {
      alias /srv/media/;
      types { image/webp webp; }
      default_type application/octet-stream;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control "public, max-age=86400";
      location ~* \.(?!webp$)[a-z0-9]+$ { return 404; }
    }
    location /django-static/ { alias /srv/django-static/; expires 7d; }
    location = /cms-admin/login/ {
      limit_req zone=admin_login burst=5 nodelay;
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $rgi_proto;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /cms-admin/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $rgi_proto;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    # CMS is private: only server-side Next.js fetches may access its JSON API.
    location /cms-api/ { return 404; }
    location /health/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location = /api/enquiries {
      client_max_body_size 6m;
      limit_req zone=forms burst=5 nodelay;
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $rgi_proto;
      proxy_set_header X-RGI-Client-IP $remote_addr;
      proxy_buffering off;
    }
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $rgi_proto;
      proxy_set_header X-RGI-Client-IP $remote_addr;
      proxy_buffering off;
    }
  }
}
